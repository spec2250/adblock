name: Build APK
on:
  push:
    branches: [ main, master ]
    # Documentation/tooling changes must not produce a release APK.
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - 'design/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep ONE debug keystore across runs. Without this, every build gets a
      # brand new signature and Android refuses the in-app update
      # ("signature mismatch"), which made "تحديث الآن" do nothing.
      - name: Keep stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1
      # AGP does not always materialise the debug keystore before packaging,
      # so create it explicitly. Gradle then reuses the same key on every run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reusing cached debug keystore"
          fi
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
      - name: Build debug APK
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Package APK as ZIP
        run: cd app/build/outputs/apk/debug && zip -j app-debug.zip *.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AdBlocker v${{ github.run_number }}
          body: |
            • اكتشاف تلقائي (Auto) لنطاقات الإعلان والتتبع وحجبها.
            • إشعار دائم في الهاتف بزر تشغيل/إيقاف ومع عدّاد الإعلانات.
            • مفتاح Toggle أنيق بدل زر التشغيل، وحركات ظهور ناعمة.
            • تصميم جديد لحركة الدرع بدون خلفية.
            • زر «تحقق من التحديثات» للتطبيق بدل تحديث القائمة.
          files: app/build/outputs/apk/debug/app-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
